name: Build Dolphin APK
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug or release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
env:
  NDK_VERSION: '30.0.15729638'
  CMAKE_VERSION: '3.22.1'
  COMPILE_SDK: '36'
  BUILD_TOOLS: '36.0.0'
  CCACHE_COMPRESS: '1'
  CCACHE_COMPRESSLEVEL: '5'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK Components
        run: |
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses > /dev/null || true
          for i in {1..3}; do
            sdkmanager --install \
              "platforms;android-${COMPILE_SDK}" \
              "build-tools;${BUILD_TOOLS}" \
              "ndk;${NDK_VERSION}" \
              "cmake;${CMAKE_VERSION}" && break || sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-Linux-v2-locked
          restore-keys: ccache-Linux-v2-locked
      - name: Cache CMake .cxx
        uses: actions/cache@v4
        with:
          path: Source/Android/app/.cxx
          key: cxx-Linux-v2-locked
          restore-keys: cxx-Linux-v2-locked
      - name: Build APK
        working-directory: Source/Android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          chmod +x gradlew
          export CCACHE_DIR=~/.ccache
          ccache --max-size=3G
          ccache -z
          ./gradlew assemble${BUILD_TYPE^} \
            --no-daemon \
            --stacktrace \
            --build-cache \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          ccache -s
      - name: Rename APK
        working-directory: Source/Android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          mkdir -p build/outputs/apk/${BUILD_TYPE}/
          mv app/build/outputs/apk/${BUILD_TYPE}/*.apk build/outputs/apk/${BUILD_TYPE}/Dolphin.apk || true
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-${{ github.event.inputs.build_type || 'debug' }}
          path: Source/Android/build/outputs/apk/${{ github.event.inputs.build_type || 'debug' }}/Dolphin.apk
          if-no-files-found: error
